<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>35xw</title>
<!--
    OVDJE IDE TVOJ GATE.

    Zamijeni cijelu ovu datoteku svojom (ime mora ostati gate.html).
    Jedino što tvoj gate mora napraviti u trenutku kad pušta korisnika unutra
    je izvršiti ovu jednu liniju:

        window.parent.postMessage({ type: '35xw-unlock' }, '*');

    Glavna stranica tada sama ugasi gate i pokrene aplikaciju.
-->
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff;
                 font-family: 'Inter', system-ui, sans-serif; display: flex;
                 align-items: center; justify-content: center; }
    button { padding: 14px 32px; font-size: 16px; border: 1px solid rgba(255,255,255,.3);
             border-radius: 12px; background: rgba(255,255,255,.06); color: #fff; cursor: pointer; }
    button:hover { background: rgba(255,255,255,.14); }
</style>
</head>
<body>
    <button id="enter">Enter</button>
    <script>
        document.getElementById('enter').addEventListener('click', function () {
            window.parent.postMessage({ type: '35xw-unlock' }, '*');
        });
    </script>
</body>
</html>
